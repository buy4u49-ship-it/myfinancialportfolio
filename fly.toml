app = "myfinancialportfolio"
primary_region = "nrt"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "python market_price_worker.py --stock-shard-count 4 --stock-shard-index 0"
  stock1 = "python market_price_worker.py --disable-crypto --stock-shard-count 4 --stock-shard-index 1"
  stock2 = "python market_price_worker.py --disable-crypto --stock-shard-count 4 --stock-shard-index 2"
  stock3 = "python market_price_worker.py --disable-crypto --stock-shard-count 4 --stock-shard-index 3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
